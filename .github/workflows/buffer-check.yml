name: buffer-check
on:
  workflow_dispatch:
    inputs:
      post_id: {required: true, type: string}
      action: {required: true, type: string, default: status}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {BUFFER_API_KEY: "${{ secrets.BUFFER_API_KEY }}"}
        run: python scripts/buffer_check.py "${{ inputs.post_id }}" "${{ inputs.action }}"
